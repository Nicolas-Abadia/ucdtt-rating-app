{% extends "players/base_html.html" %}
{% block content %}
  <h1>UCDTT Club Rating App</h1>
  <p><a href="{% url "players:matches" %}">Matches Record</a></p>
  <p><a href="{% url "players:new" %}">Add new Player</a></p>
  <h2>Leadboard</h2>
  <ul>
    {% for player in player_list %}
      <li>{{ player.rating }} | <a href="{% url "players:detail" player.id %}">{{ player.name }}</a></li>
    {% endfor %}
  </ul>
{% endblock content %}
