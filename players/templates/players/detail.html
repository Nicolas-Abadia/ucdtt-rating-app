{% extends "players/base_html.html" %}
{% block content %}
  <h1>{{ player.name }}</h1>
  <p>Rating: {{ player.rating }}</p>
  <p>Registered on: {{ player.created_date }}</p>
  {% if user.is_authenticated %}
  <p><a href="{% url "players:update" player.id %}">edit</a></p>
  <form action="{% url "players:delete" player.id %}" method="post" onsubmit="return confirm('Delete {{ player.name }}? This cannot be undone.');">
    {% csrf_token %}
    <button type="submit">delete</button>
  </form>
  {% endif %}
{% endblock content %}
