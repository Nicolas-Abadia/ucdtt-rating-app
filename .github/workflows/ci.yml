# Continuous integration for the UCDTT rating app.
#
# Render auto-deploys main, so a push to main is a production deploy. This
# workflow is the gate in front of that: it runs the same checks that were
# previously run by hand and easy to skip.
#
# Two independent jobs, on purpose. "tests" answers "does the app still
# work", "deploy-checks" answers "would this still deploy". Neither waits
# for the other, so a failure report names which of the two broke rather
# than hiding one behind the other.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A quick follow-up push makes the previous run pointless. Cancel it rather
# than paying for two runs and reading the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The suite runs against real Postgres, not SQLite. The Match table has
    # database-level CheckConstraints and the imports rely on Postgres
    # behaviour, so testing on another backend would test a different app.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucdtt
          POSTGRES_PASSWORD: ucdtt
          POSTGRES_DB: ucdtt_rating
        ports:
          - 5432:5432
        # Without a health check the steps can start before Postgres is
        # accepting connections, which fails as a confusing OperationalError.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same shape as .env.example. Nothing secret: this database exists for
      # the length of one job and is thrown away.
      DATABASE_URL: postgres://ucdtt:ucdtt@localhost:5432/ucdtt_rating
      DJANGO_SECRET_KEY: ci-tests-only-not-a-production-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for model changes with no migration
        # Fails when models.py has drifted from the migration files. That
        # drift is invisible locally until a fresh database is built, and on
        # Render it surfaces as a deploy that runs the old schema.
        run: python manage.py makemigrations --check --dry-run

      - name: Run the test suite
        run: python manage.py test --verbosity 2

  deploy-checks:
    name: Deploy checks
    runs-on: ubuntu-latest

    env:
      # DEBUG False is the point of this job: it switches on the production
      # branch of settings.py (manifest static storage, SSL redirect, secure
      # cookies, HSTS), which the test job never exercises.
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ucdtt-rating-app.onrender.com
      # check --deploy rejects a short or low-entropy key, so this filler is
      # deliberately long. The real key lives in Render's environment.
      DJANGO_SECRET_KEY: ci-only-do-not-use-1a2b3c4d5e6f7g8h9i0j-klmnopqrstuvwxyz
      # Never connected to. Present so settings.py has a URL to parse.
      DATABASE_URL: postgres://ucdtt:ucdtt@localhost:5432/ucdtt_rating

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        # Reproduces Render's build step. WhiteNoise's manifest backend
        # refuses to resolve a {% static %} tag that collectstatic did not
        # build, which is exactly the ValueError that took the first deploy
        # down. Failing here costs a minute; failing on Render costs the
        # live site.
        run: python manage.py collectstatic --noinput

      - name: Django deployment checklist
        # --fail-level WARNING because every finding this raises is a real
        # production setting, and all six were resolved once already. A
        # warning that does not fail the build is a warning nobody reads.
        run: python manage.py check --deploy --fail-level WARNING
