{% extends "players/base_html.html" %}
{% block content %}
<h2>{% if object.pk %}Edit Player{% else %}Add New Player{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% if object.pk %}Edit{% else %}Add{% endif %}</button>
</form>
{% endblock content %}
