{% extends "players/base_html.html" %}
{% block content %}
<h2>Officer Login</h2>
{% if form.errors %}
  <p>Your username and password didn't match. Please try again.</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Login</button>
  <input type="hidden" name="next" value="{{ next }}">
</form>
{% endblock content %}
